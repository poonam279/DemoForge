[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs-22_x", "ffmpeg"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "cd backend && /opt/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2"
